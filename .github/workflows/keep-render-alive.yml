name: Keep Render Storefront Awake

on:
  schedule:
    - cron: "*/14 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping NAD storefront
        run: curl --fail --silent --show-error --location --max-time 30 https://nad-storefront.onrender.com/
